name: Build SmoothZoom

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Configure
        run: |
          cmake -B build \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Package .levipack
        run: |
          mkdir -p package
          cp assets/manifest.json package/
          cp build/libSmoothZoom.so package/
          cd package
          zip -r ../SmoothZoom.levipack .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmoothZoom.levipack
          path: SmoothZoom.levipack

      - name: Update "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Automatically built from commit ${{ github.sha }}.
          prerelease: true
          files: SmoothZoom.levipack